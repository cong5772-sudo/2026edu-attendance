<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b6b6a">
<title>간호교육 참석현황 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b6b6a'/%3E%3Cpath d='M9 22V10h3l5 7.5V10h3v12h-3l-5-7.5V22z' fill='%23fff'/%3E%3C/svg%3E">
<style>
body{margin:0}[hidden]{display:none!important}
@font-face{font-family:"S-Core Dream";font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-4Regular.woff") format("woff")}
@font-face{font-family:"S-Core Dream";font-weight:500;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff") format("woff")}
@font-face{font-family:"S-Core Dream";font-weight:600;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-6Bold.woff") format("woff")}
@font-face{font-family:"S-Core Dream";font-weight:700 900;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-8Heavy.woff") format("woff")}
:root{
  --bg:#f3f5f9;--surface:#fff;--sunk:#f4f6fa;--ink:#111827;--ink2:#4b5563;--muted:#6b7280;
  --line:#e6eaf1;--line2:#d5dbe5;--accent:#2563eb;--accent-ink:#fff;--accent-soft:#e8efff;
  --navy:#1f3a68;--navy2:#2a4b85;
  --c-REG:#2563eb;--c-EMG:#f59e0b;--c-TOP:#10b981;--c-DED:#8b5cf6;--c-SEN:#ec4899;--c-PTL:#06b6d4;--c-MOV:#64748b;--c-SPC:#ea580c;
  --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--good-ink:#006300;--crit-ink:#b42d2d;
  --f-ui:"S-Core Dream","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-num:var(--f-ui);--r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220;--surface:#121a2b;--sunk:#0f1626;--ink:#e8edf6;--ink2:#b6c0d1;--muted:#8a96aa;
    --line:#1f2a3f;--line2:#2b3954;--accent:#60a5fa;--accent-ink:#0b1220;--accent-soft:#16264a;
    --navy:#14254a;--navy2:#1d3566;
    --c-REG:#60a5fa;--c-EMG:#fbbf24;--c-TOP:#34d399;--c-DED:#a78bfa;--c-SEN:#f472b6;--c-PTL:#22d3ee;--c-MOV:#94a3b8;--c-SPC:#fb923c;
    --good-ink:#5fd35f;--crit-ink:#ee7f7f;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font-family:var(--f-ui)}
button{font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* topbar */
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(16px,2vw,28px);background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(17,24,39,.05)}
.tb-l{display:flex;align-items:center;gap:12px;min-width:0}
.logo-sq{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:22px;line-height:1;box-shadow:0 4px 10px rgba(37,99,235,.3)}
.tb-title{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.org{display:grid;text-align:right;line-height:1.25;margin-right:6px}
.org b{font-size:14px;font-weight:700;color:var(--navy)}
.org small{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 6px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.refresh{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer;font-size:16px}.refresh:hover{border-color:var(--accent);color:var(--accent)}.refresh.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pill b{font-weight:500}.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
/* layout */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);gap:24px;align-items:start;padding:24px clamp(16px,2vw,28px) 48px}
.side{position:sticky;top:76px;display:grid;gap:14px;align-content:start;max-height:calc(100vh - 92px);overflow:auto;padding-bottom:4px}
.navcard{background:linear-gradient(160deg,var(--navy2),var(--navy));border-radius:16px;padding:10px;box-shadow:0 6px 18px rgba(31,58,104,.22)}
.navlist{display:grid;gap:4px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;border-radius:10px;background:none;color:rgba(255,255,255,.82);font-weight:600;font-size:14.5px;text-align:left;cursor:pointer}
.navbtn .ic{width:18px;text-align:center;opacity:.85}
.prl{display:grid;gap:8px}.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pr .pt{display:grid;gap:3px;min-width:0}.pr .pk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.pr select:disabled{opacity:.5}.btn:disabled{opacity:.45;cursor:default}.pr .pt b{font-size:13.5px;word-break:keep-all;overflow-wrap:anywhere}
.pr .pc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pr select{height:34px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 8px;font-size:13px}
@media (max-width:820px){.pr{grid-template-columns:minmax(0,1fr)}}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px}
.fcard summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fcard summary::-webkit-details-marker{display:none}
.fcard summary span{font-weight:500;font-size:11px;color:var(--accent);text-align:right}
.fcard[open] summary{margin-bottom:12px}
.fgrid{display:grid;gap:14px}
.fs{display:grid;gap:7px}.fl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.cg{display:flex;flex-wrap:wrap;gap:6px}
.ms-wrap{position:relative}
.msb{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13.5px;cursor:pointer;text-align:left}
.msb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msb i{font-style:normal;color:var(--muted);font-size:12px}
.msb[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.msp{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;max-height:300px;overflow:auto;padding:6px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);box-shadow:0 10px 28px rgba(17,24,39,.16)}
.mso{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.mso:hover{background:var(--sunk)}.mso input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.cg.mg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.cg.mg .chip{padding:0}
.chip:disabled{opacity:.35;cursor:default}.chip:disabled:hover{border-color:var(--line2)}
.seldis{height:38px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--muted);font-size:13px}
.fsum{margin:-4px 0 12px;font-size:12px;color:var(--accent);font-weight:600;line-height:1.5}
.fcard .chip{height:32px;padding:0 12px;font-size:13px;font-weight:500}
.fcard select{height:38px;width:100%;border:1px solid var(--line2);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);font-size:13.5px}
.fhint{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.freset{height:34px;border:1px dashed var(--line2);border-radius:10px;background:none;color:var(--ink2);font-size:12.5px;cursor:pointer}
.freset:hover{border-color:var(--accent);color:var(--accent)}
.navfoot{display:grid;gap:5px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:12px;color:var(--muted)}.navfoot b{color:var(--ink2);font-weight:600}
.main{display:grid;gap:20px;align-content:start;min-width:0}
.head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.head p{margin:4px 0 0;color:var(--ink2);font-size:13px;max-width:70ch}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;gap:6px;align-content:start;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.kpi .lab{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.kpi:nth-child(n+2) .lab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.kpi:nth-child(4) .lab::before{background:#f59e0b}
.kpi .val{font-size:36px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.kpi:nth-child(2) .val,.kpi:nth-child(3) .val{color:var(--accent)}
.kpi:nth-child(4) .val{color:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi:nth-child(4) .val{color:#fbbf24}}
.kpi .val small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px;letter-spacing:0}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi:first-child{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--navy2),var(--navy));border-color:transparent;color:#fff}
.kpi:first-child::before,.kpi:first-child::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.kpi:first-child::before{width:150px;height:150px;right:-30px;top:-50px}
.kpi:first-child::after{width:110px;height:110px;right:70px;bottom:-60px}
.kpi:first-child .lab,.kpi:first-child .sub,.kpi:first-child .val small{color:rgba(255,255,255,.82)}
.kpi:first-child .val{font-size:42px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 2px;font-size:17px;font-weight:700}
.card h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);flex:none}
.card .hint{margin:0 0 12px;font-size:12px;color:var(--muted)}
.sech{display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:17px;font-weight:700}
.sech::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 8px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--ink2)}
.chart .tot{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.bar{cursor:pointer}.bar:hover{opacity:.8}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.catc{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;gap:8px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(17,24,39,.04);transition:border-color .15s,box-shadow .15s}
.catc:hover{border-color:var(--line2);box-shadow:0 3px 10px rgba(17,24,39,.07)}
.catc .n{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}.catc .n i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--cc)}
.catc .grp{font-size:11px;color:var(--muted)}
.catc .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.catc .big{font-size:26px;font-weight:700;color:var(--ink)}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.prog>i{display:block;height:100%;background:var(--navy2);opacity:.85}
.catc small{color:var(--ink2);font-size:12px}
/* chips / toggle / buttons */
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .gl{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--cc)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.tg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-size:13px;color:var(--ink2)}
.tg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{padding:7px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink2);display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
select{font:inherit}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;z-index:2;background:var(--sunk);font-weight:600;font-size:12px;color:var(--ink2);white-space:normal}
thead th .cdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--cc)}
.tw:not(.tl) thead th{min-width:76px;word-break:keep-all}
.tw:not(.tl) thead th:first-child{min-width:84px}
tbody th{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font-weight:600}
thead th:first-child{left:0;z-index:3}
tbody tr:hover td,tbody tr:hover th{background:var(--sunk)}
tr.sum td,tr.sum th{background:var(--surface);font-weight:700;border-top:2px solid var(--line2);color:var(--ink)}
td.zero{color:var(--muted)}
td.heat{font-weight:600}
td.tot,th.tot{font-weight:700;border-left:1px solid var(--line2)}
.tl td,.tl th{white-space:normal;text-align:left}
.tl td.r{text-align:right;white-space:nowrap}
.tl tbody tr{cursor:pointer}
.st{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.st.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.st.plan{color:var(--muted)}.st.warn{border-color:var(--warn);color:var(--ink2)}
.kc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}.kc i{flex:none;width:8px;height:8px;border-radius:2px;background:var(--cc)}
.note{font-size:12px;color:var(--muted)}
.callout{padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);border-left:4px solid var(--accent);font-size:13px}
ul.plain{margin:6px 0 0;padding-left:18px;color:var(--ink2)}ul.plain li{margin:4px 0}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mini{display:grid;gap:8px}.mini .l{display:grid;grid-template-columns:92px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:12.5px}
.mini.share .l{grid-template-columns:140px minmax(0,1fr) 40px;gap:10px}
.mini .b{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}.mini .b i{display:block;height:100%;background:var(--accent)}
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(11,18,32,.5)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:16px;font-weight:700}.dh p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.db{padding:14px 18px 18px;overflow:auto;max-height:68vh;display:grid;gap:14px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink2);line-height:1}
#tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;padding:8px 10px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (max-width:1100px){
  .app{grid-template-columns:230px minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .cats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .topbar{flex-wrap:nowrap;gap:8px;padding:8px 14px}
  .tb-title{font-size:13.5px;letter-spacing:-.03em}
  .logo-sq{width:28px;height:28px;font-size:18px}
  .pill b{display:none}.pill{font-size:11px;padding:2px 4px}
  .org{margin-right:2px}.org b{font-size:11px;letter-spacing:-.03em}.org small{font-size:10px}
  .tb-r{flex-wrap:nowrap;gap:6px}.refresh{width:28px;height:28px}.tb-l{flex:1 1 auto}.tb-title{font-size:12.5px}
  .app{grid-template-columns:minmax(0,1fr);padding-top:14px;gap:14px}
  .side{position:static;max-height:none;overflow:visible}
  .navcard{padding:6px}
  .navcard .navlist{grid-template-columns:repeat(5,1fr)}
  .navbtn{flex-direction:column;gap:2px;padding:8px 2px;font-size:11.5px;text-align:center;justify-content:center}
  .side .navfoot{display:none}
  .stat3{grid-template-columns:minmax(0,1fr)}
  .kpi{padding:16px}.kpi .val{font-size:28px}.kpi:first-child .val{font-size:32px}
  .head h1{font-size:19px}
  .card h2{font-size:16px}
}
@media (max-width:520px){
  .mini.share .l{grid-template-columns:118px minmax(0,1fr) 36px;gap:8px}.mini.share .kc{white-space:normal;align-items:flex-start;line-height:1.3}.mini.share .kc i{margin-top:4px}
  .cats{grid-template-columns:minmax(0,1fr)}
  th,td{padding:7px 7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-l"><span class="logo-sq" aria-hidden="true">+</span><b class="tb-title">2026 간호교육 참석현황 대시보드</b></div>
  <div class="tb-r">
    <div class="org"><b>인제대학교 해운대백병원 간호국</b><small>간호교육팀</small></div>
    <span class="pill hide-s"><span class="dot"></span>데이터 기준 <b class="num" id="asof">–</b></span>
    <span class="pill hide-s">시트 갱신 <b class="num" id="upd">–</b></span>

const fmt = n => (n ?? 0).toLocaleString('ko-KR');

const cvar = k => `style="--cc:var(--c-${k})"`;

Object.assign(S, {ys:new Set(), ms:new Set(), cats:new Set(), grp:'all', units:new Set(), open:null}); // 기준일시(연도)·월·세부부서는 다중 선택
const GROUPS = [

const deptSel = i => i < 0 ? !deptActive() : (S.grp === 'all' || grpIdx().includes(i)) && (!S.units.size || S.units.has(i));

const catOK = k => !S.cats.size || S.cats.has(k);
const sessF = () => SESS.filter(s => inR(s) && catOK(s.k)).map(view);
const attF = () => ATT.filter(a => inR(a.s) && catOK(a.s.k) && deptSel(a.di));
const attXF = () => ATTX.filter(a => ymOK(a.ym) && catOK(a.k) && deptSel(a.di));
const rowsU = () => [...attF().map(a => ({k:a.s.k, m:a.s.sm, p:a.p, di:a.di})), ...attXF().map(a => ({k:a.k, m:a.ym, p:a.p, di:a.di}))]; // 6개 구분 + 부서이동자·부서별 특성화
const visK = () => ALLK.filter(catOK);
const GK = [['직무교육', ['REG', 'EMG', 'TOP', 'DED']], ['관리자교육', ['SEN', 'PTL']], ['부서이동자 교육', ['MOV']], ['부서별 특성화 교육', ['SPC']]];
const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);

// ---- shell ----
const PAGES = {
  p1:['종합 현황','정기직무교육·응급간호술기·주제별 술기·전담간호사 직무교육·선임간호사 교육·파트장 교육 6개 구분의 교육 실시와 참석 현황입니다.'],
  p2:['직무·관리자교육','직무교육(정기·응급·주제별·전담)과 관리자교육(선임간호사·파트장)을 한 화면에서 구분별로 확인합니다.'],
  p3:['부서별 직무교육 참석현황','병동 순서(14A → … → PAM → 기타)에 맞춰 6개 구분별 참석 인원을 정리했습니다.'],
  p5:['분류 관리','시트에 자동 입력된 교육 중 분류되지 않은 교육을 구분·교육과정명으로 지정합니다. 지정한 내용은 구글시트에 저장되어 다음 집계부터 자동 반영됩니다.'],
  p4:['데이터 점검','교육 분류 결과와 원내교육실시현황과의 차이를 확인합니다. 자동 입력 데이터가 늘어날 때 먼저 살펴볼 페이지입니다.']
};
// 여러 개를 고를 수 있는 선택 상자(체크박스 목록). 고르는 동안 열린 채로 유지됩니다.
const combo = (f, label, items) => `<button type="button" class="msb" data-ms="${f}" aria-expanded="${S.open === f}"><span>${esc(label)}</span><i aria-hidden="true">▾</i></button>${S.open === f ? `<div class="msp" role="listbox" aria-multiselectable="true">${items.map(([v, t, on]) => `<label class="mso"><input type="checkbox" data-f="${f}" data-v="${esc(v)}"${on ? ' checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>` : ''}`;
function catGroupSummary() {
  if (!S.cats.size) return '전체';
  const on = GK.filter(([n, ks]) => ks.every(k => S.cats.has(k))).map(g => g[0]);
  const rest = [...S.cats].filter(k => !GK.some(([n, ks]) => ks.includes(k) && ks.every(x => S.cats.has(x))));
  return on.length && !rest.length ? (on.length <= 2 ? on.join(', ') : on.length + '개 선택') : (S.cats.size + '개 구분 선택');
}
function catKeySummary() {
  if (!S.cats.size) return '전체';
  const ks = ALLK.filter(k => S.cats.has(k));
  return ks.length <= 2 ? ks.map(k => ALLN[k]).join(', ') : ks.length + '개 선택';
}
function filterHTML() {
  const opt = (v, t, cur) => `<option value="${esc(v)}"${String(cur) === String(v) ? ' selected' : ''}>${esc(t)}</option>`;
  const chip = (f, v, t, on, dis) => `<button class="chip" data-f="${f}" data-v="${v}" aria-pressed="${on}"${dis ? ' disabled' : ''}>${t}</button>`;
  const has = new Set([...SESS.map(s => s.sm), ...ATTX.map(a => a.ym)]);
  const monthHas = m => YEARS.some(y => (!S.ys.size || S.ys.has(y)) && has.has(`${y}-${String(m).padStart(2, '0')}`));
  const qOn = q => [1, 2, 3].every(i => S.ms.has((q - 1) * 3 + i));
  const units = grpIdx() || [];
  const hint = S.page === 'p4' ? '<p class="fhint">데이터 점검 페이지는 조회 조건과 무관하게 전체 데이터를 보여줍니다.</p>' : '';
  return `<div class="fs"><span class="fl">기준일시</span><div class="cg">${chip('y', 'all', '전체', !S.ys.size)}${YEARS.map(y => chip('y', y, y + '년', S.ys.has(y))).join('')}</div></div>
    <div class="fs"><span class="fl">분기</span><div class="cg">${chip('q', 'all', '전체', !S.ms.size)}${[1, 2, 3, 4].map(q => chip('q', q, q + '분기', qOn(q))).join('')}</div></div>
    <div class="fs"><span class="fl">월</span><div class="cg mg">${Array.from({length: 12}, (_, i) => i + 1).map(m => chip('m', m, m + '월', S.ms.has(m), !monthHas(m))).join('')}</div></div>
    <div class="fs ms-wrap"><span class="fl">교육 종류</span>${combo('cg', catGroupSummary(), [['all', '전체', !S.cats.size], ...GK.map(([n, ks]) => [n, n, ks.every(k => S.cats.has(k))])])}</div>
    <div class="fs ms-wrap"><span class="fl">교육 구분</span>${combo('ck', catKeySummary(), [['all', '전체', !S.cats.size], ...ALLK.map(k => [k, ALLN[k], S.cats.has(k)])])}</div>
    <div class="fs"><span class="fl">부서</span><select data-f="grp">${opt('all', '전체 부서', S.grp)}${GROUPS.map(g => opt(g[0], g[0], S.grp)).join('')}</select></div>
    <div class="fs"><span class="fl">세부부서</span>${S.grp === 'all' ? '<div class="seldis">부서를 먼저 선택</div>' : `<div class="cg">${chip('u', 'all', '전체', !S.units.size)}${units.map(i => chip('u', i, esc(DEPTS[i]), S.units.has(i))).join('')}</div>`}</div>
    <button class="freset" data-f="reset">조건 초기화</button>
    <p class="fhint">분기·월·세부부서는 여러 개를 함께 선택할 수 있습니다. 기준일시 ${esc(D.updated)} 갱신 데이터</p>${hint}`;
}
function filterSummary() {
  const y = S.ys.size ? [...S.ys].sort().join('·') + '년' : '전체 연도';
  const m = S.ms.size ? [...S.ms].sort((a, b) => a - b).join('·') + '월' : '전체 월';
  const u = S.units.size ? ([...S.units].length <= 2 ? [...S.units].map(i => DEPTS[i]).join('·') : S.units.size + '개 부서') : S.grp !== 'all' ? S.grp : '전체 부서';

const tog = (set, v) => set.has(v) ? set.delete(v) : set.add(v);

    if (v === 'all') S.ms.clear();

  }
  else if (f === 'm') tog(S.ms, +v);

  render();
}
document.addEventListener('click', e => {
  const ms = e.target.closest('button[data-ms]');

function render() {

  renderFilters();
  $('#view').innerHTML = ({p1:p1, p2:p2, p3:p3, p4:p4, p5:p5})[S.page]();
  bind();
}

// ---- charts ----
function stackChart(months, byMonth, keys, h = 230) {
  const W = 640, H = h, L = 34, R = 8, T = 18, B = 26;
  const max = Math.max(10, ...months.map(m => sum(keys, k => byMonth[m]?.[k] || 0)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p * 2) / 2 * p; })();
  const bw = (W - L - R) / months.length;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4, y = H - B - (H - B - T) * i / 4; g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`; }
  months.forEach((m, i) => {
    let y = H - B; const x = L + i * bw + bw * .18, w = bw * .64; let tot = 0;
    keys.forEach(k => { const v = byMonth[m]?.[k] || 0; tot += v; if (!v) return; const hh = (H - B - T) * v / nice; y -= hh;
      g += `<rect class="bar" x="${x}" y="${y}" width="${w}" height="${hh}" fill="var(--c-${k})" data-tip="${esc(ml(m))} · ${esc(ALLN[k])}: ${fmt(v)}명" rx="2"/>`; });
    if (tot) g += `<text class="tot" x="${x + w/2}" y="${y - 4}" text-anchor="middle">${fmt(tot)}</text>`;
    g += `<text x="${x + w/2}" y="${H - 8}" text-anchor="middle">${ml(m)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 참석 연인원 누적 막대">${g}</svg>`;
}
const legend = keys => `<div class="legend">${keys.map(k => `<span><i style="background:var(--c-${k})"></i>${ALLN[k]}</span>`).join('')}</div>`;
function monthDataU(rows, keys) {
  const o = {}; rows.forEach(r => { if (!keys.includes(r.k)) return; (o[r.m] ??= {}); o[r.m][r.k] = (o[r.m][r.k] || 0) + 1; }); return o;
}
function monthData(att, keys) {
  const o = {}; att.forEach(a => { if (!keys.includes(a.s.k)) return; (o[a.s.sm] ??= {}); o[a.s.sm][a.s.k] = (o[a.s.sm][a.s.k] || 0) + 1; }); return o;
}

function matrix() {
  const at = attF();
  const mk = () => KEYS.map(() => S.metric === 'rows' ? 0 : new Set());
  const m = DEPTS.map(mk), unkRow = mk();
  const tot = DEPTS.map(() => S.metric === 'rows' ? 0 : new Set());
  at.forEach(a => {

    if (a.di < 0) { if (S.metric === 'rows') unkRow[ki]++; else unkRow[ki].add(a.p); return; }
    if (S.metric === 'rows') { m[a.di][ki]++; tot[a.di]++; } else { m[a.di][ki].add(a.p); tot[a.di].add(a.p); }

  const val = x => S.metric === 'rows' ? x : x.size;
  const cells = m.map(r => r.map(val)), totals = tot.map(val);
  const colSum = KEYS.map(k => S.metric === 'rows' ? at.filter(a => a.s.k === k).length : new Set(at.filter(a => a.s.k === k).map(a => a.p)).size);

  const allTot = S.metric === 'rows' ? at.length : uniq(at);
  return {cells, totals, colSum, allTot, unk, unkTot};
}

  <section class="card"><div class="tools"><div><h2>분류되지 않은 교육 <span class="note">${list.length}건</span></h2><p class="hint" style="margin:0">구분 → 교육과정명 → 교육과정명-2 순서로 고르고 「저장」하면 같은 교육명은 앞으로 자동 분류됩니다. 대시보드에 필요 없는 교육은 「제외」를 누르세요. 시트 기준 ${esc(d.built || '')}</p></div></div>
    <div class="tools" style="margin:10px 0"><input type="search" id="q5" placeholder="교육명 검색" value="${esc(S5.q)}" style="flex:1;min-width:180px">
    <label class="note"><input type="checkbox" id="hn" ${S5.hideNew ? 'checked' : ''}> 신규 교직원 교육 숨김</label>
    <button class="btn" data-a="bex">선택 항목 제외</button></div>
    <div class="prl">${list.map(row).join('') || '<p class="note">분류할 교육이 없습니다.</p>'}</div></section>
  <section class="card"><h2>수동 분류 목록 <span class="note">${d.manual.length}건</span></h2><p class="hint">해제하면 자동 분류 규칙으로 되돌아갑니다.</p>
    <div class="tw tl"><table><thead><tr><th>교육명</th><th>분류</th><th>등록일</th><th></th></tr></thead><tbody>${man || '<tr><td colspan="4">없음</td></tr>'}</tbody></table></div></section>`;
}
async function post5(items, msgOk) {
  S5.loading = true; S5.msg = ''; render();
  await api5('POST', {}, {action:'classify', items});
  await loadRemote(); await load5();
}
async function act5(el) {
  const a = el.dataset.a;
  try {
    if (a === 'tk') { S5.token = $('#tk').value.trim(); try { localStorage.setItem('edu_token', S5.token); } catch (_) {} await load5(); return; }
    if (a === 'rb') { S5.msg = ''; S5.loading = true; render(); await api5('POST', {}, {action:'rebuild'}); await loadRemote(); await load5(); return; }
    const row = el.closest('.pr'), title = row && row.dataset.t;
    if (a === 'sv') {
      const x = S5.data.pending.find(p => p.title === title), s = selOf(x);
      if (!selDone(s)) { S5.msg = '구분, 교육과정명, 교육과정명-2를 모두 선택하세요.'; render(); return; }
      await post5([{title, g:s[0], c1:s[1], c2:s[2] || ''}]); return;
    }
    if (a === 'ex') { await post5([{title, g:EXC}]); return; }
    if (a === 'bex') {
      const titles = [...document.querySelectorAll('.pr [data-chk]:checked')].map(c => c.closest('.pr').dataset.t);
      if (!titles.length) { S5.msg = '제외할 교육을 먼저 체크하세요.'; render(); return; }
      await post5(titles.map(t => ({title:t, g:EXC}))); return;
    }
    if (a === 'un') { S5.loading = true; render(); await api5('POST', {}, {action:'unclassify', titles:[el.dataset.t]}); await loadRemote(); await load5(); }
  } catch (e) { S5.loading = false; S5.msg = String(e.message || e); render(); }
}
// ---- interactions ----
function openSession(id) {
  const s = SESS[id], at = ATT.filter(a => a.sid === id);
  const dm = Array(DEPTS.length).fill(0), pm = Array(POS.length).fill(0);
  at.forEach(a => { dm[a.di]++; pm[a.pi]++; });
  const mx = Math.max(1, ...dm), px = Math.max(1, ...pm);
  $('#dt').textContent = s.t;
  $('#dp').innerHTML = `${KN[s.k]} · ${s.dts.length ? s.dts.map(md).join(', ') : md(s.d) + ' (예정)'}${s.min ? ' · ' + s.min + '분' : ''}${s.tg ? ' · 대상: ' + esc(s.tg) : ''}`;
  $('#dbody').innerHTML = s.unk ? `<p class="note">이 교육은 시트1 참석자 명단에 아직 반영되지 않아 시트2의 참석 인원(${fmt(s.n2)}명)만 확인됩니다.</p>` : s.st !== 'done' ?`<p class="note">${stLabel(s.st)} 상태로 참석 데이터가 없습니다.</p>` : `
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="lab">참석(중복 제거)</div><div class="val">${fmt(s.n1)}<small>명</small></div></div><div class="kpi"><div class="lab">시트2 합계</div><div class="val">${fmt(s.n2)}<small>명</small></div></div><div class="kpi"><div class="lab">원내현황</div><div class="val">${s.mc ?? '–'}<small>${s.mc == null ? '' : '명'}</small></div></div></div>
    <div><b>부서별</b><div class="mini" style="margin-top:8px">${DEPTS.map((d, i) => dm[i] ? `<div class="l"><span>${esc(d)}</span><span class="b"><i style="width:${dm[i] / mx * 100}%"></i></span><span class="num" style="text-align:right">${dm[i]}</span></div>` : '').join('')}</div></div>
    <div><b>직위별</b><div class="mini" style="margin-top:8px">${POS.map((p, i) => pm[i] ? `<div class="l"><span>${esc(p)}</span><span class="b"><i style="width:${pm[i] / px * 100}%"></i></span><span class="num" style="text-align:right">${pm[i]}</span></div>` : '').join('')}</div></div>`;
  $('#dlg').showModal();
}
function bind() {
  document.querySelectorAll('[data-sid]').forEach(r => r.addEventListener('click', () => openSession(+r.dataset.sid)));
  document.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => { S.k = b.dataset.cat; go('p2'); }));
  document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { S.k = b.dataset.k; render(); }));
  document.querySelectorAll('[data-metric]').forEach(b => b.addEventListener('click', () => { S.metric = b.dataset.metric; render(); }));
  document.querySelectorAll('[data-dept]').forEach(r => r.addEventListener('click', () => { S.dept = +r.dataset.dept; render(); $('#dp')?.scrollIntoView({behavior:'smooth', block:'nearest'}); }));
  document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => act5(b)));
  document.querySelectorAll('.pr select[data-lv]').forEach(s => s.addEventListener('change', () => {
    const row = s.closest('.pr'), t = row.dataset.t, x = S5.data.pending.find(p => p.title === t), cur = selOf(x).slice();
    const lv = +s.dataset.lv, v = s.value;
    if (lv === 1) S5.sel[t] = [v, '', ''];
    else if (lv === 2) { const c2s = c2List(cur[0], v); S5.sel[t] = [cur[0], v, c2s.length === 1 && c2s[0] === '' ? '' : '']; }
    else S5.sel[t] = [cur[0], cur[1], v];
    render();
  }));  $('#q5')?.addEventListener('change', e => { S5.q = e.target.value; render(); });
  $('#hn')?.addEventListener('change', e => { S5.hideNew = e.target.checked; render(); });
  $('#plan-tg')?.addEventListener('change', e => { S.plan = e.target.checked; render(); });
  $('#dclose')?.addEventListener('click', () => { S.dept = null; render(); });
  $('#xl')?.addEventListener('click', exportTable);
  $('#roster')?.addEventListener('click', exportRoster);
  $('#adm')?.addEventListener('click', adminOpen);
  $('#adm-out')?.addEventListener('click', () => { S.admin = false; S5.token = ''; try { sessionStorage.removeItem('edu_admin'); } catch (_) {} render(); });
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'));
    document.head.appendChild(s);
  });
}
const sheetName = n => String(n).replace(/[\[\]\*\?\/\\:]/g, '').slice(0, 31) || 'sheet';
const condText = () => filterSummary().replace(/ · /g, '_').replace(/[\\/:*?"<>|]/g, '');
function saveWb(X, wb, name) { X.writeFile(wb, name); }
function tableRows(metric) {
  const keep = S.metric; S.metric = metric;
  const {cells, totals, colSum, allTot, unk, unkTot} = matrix();
  S.metric = keep;
  const KI = KEYS.map((k, i) => i).filter(i => catOK(KEYS[i])), pick = r => KI.map(i => r[i]);
  const rows = [['부서', ...KI.map(i => KN[KEYS[i]]), '합계']];
  DEPTS.forEach((d, i) => { if (deptSel(i)) rows.push([d, ...pick(cells[i]), totals[i]]); });
  if (unkTot) rows.push(['부서 미확인(시트1 미반영)', ...pick(unk), unkTot]);
  rows.push(['합계', ...pick(colSum), allTot]);
  return rows;
}
async function exportTable() {
  try {
    const X = await loadXLSX(), wb = X.utils.book_new();
    [['연인원', 'rows'], ['실인원', 'persons']].forEach(([n, m]) => {
      const ws = X.utils.aoa_to_sheet(tableRows(m)); ws['!cols'] = [{wch:24}, ...KEYS.map(() => ({wch:16})), {wch:10}];
      X.utils.book_append_sheet(wb, ws, n);
    });
    const info = X.utils.aoa_to_sheet([['조회 조건', filterSummary()], ['기준일시', D.updated + ' 갱신'], ['설명', '연인원=교육 참석 횟수의 합 / 실인원=중복을 제거한 사람 수']]);
    info['!cols'] = [{wch:12}, {wch:60}]; X.utils.book_append_sheet(wb, info, '조회조건');
    saveWb(X, wb, `부서별_직무교육_참석현황_${condText()}.xlsx`);
  } catch (e) { alert(e.message || e); }
}
async function exportRoster() {
  const btn = $('#roster'); if (btn) { btn.disabled = true; btn.textContent = '명단 불러오는 중…'; }
  try {
    const [X, j] = await Promise.all([loadXLSX(), api5('GET', {action:'roster', token:S5.token})]);
    const order = [...Object.keys(KN), ...Object.keys(j.keys || {}).filter(k => !(k in KN))];
    const nameOf = k => (j.keys || {})[k] || KN[k] || k;
    const rows = j.rows.filter(r => ymOK(r[7]) && catOK(r[0]) && deptSel(r[5]));
    if (!rows.length) { alert('조회 조건에 해당하는 참석자가 없습니다.'); return; }
    const wb = X.utils.book_new();
    const byDept = {}; rows.forEach(r => (byDept[r[5]] ??= []).push(r));
    const dIdx = Object.keys(byDept).map(Number).sort((a, b) => a - b);
    // 요약
    const sumRows = [['부서', '교육 구분', '참석 연인원', '참석 실인원']];
    dIdx.forEach(di => order.forEach(k => {
      const rs = byDept[di].filter(r => r[0] === k); if (!rs.length) return;
      sumRows.push([j.depts[di], nameOf(k), rs.length, new Set(rs.map(r => r[4])).size]);
    }));
    const sw = X.utils.aoa_to_sheet([[`참석자 명단 · ${filterSummary()} · ${D.updated} 갱신`], [], ...sumRows]); sw['!cols'] = [{wch:16}, {wch:24}, {wch:12}, {wch:12}];
    X.utils.book_append_sheet(wb, sw, '요약');
    // 부서별 명단
    dIdx.forEach(di => {
      const list = byDept[di].slice().sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]) || a[2].localeCompare(b[2]) || a[3].localeCompare(b[3], 'ko'));
      const aoa = [['교육 구분', '교육명', '교육일', '성명', '사번', '직위'], ...list.map(r => [nameOf(r[0]), r[1], r[2], r[3], r[4], j.pos[r[6]] || ''])];
      const ws = X.utils.aoa_to_sheet(aoa); ws['!cols'] = [{wch:20}, {wch:54}, {wch:12}, {wch:10}, {wch:10}, {wch:14}]; ws['!freeze'] = {xSplit:0, ySplit:1};
      X.utils.book_append_sheet(wb, ws, sheetName(j.depts[di]));
    });
    saveWb(X, wb, `참석자명단_${condText()}.xlsx`);
  } catch (e) { alert(e.message || e); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '참석자 명단 엑셀'; } }
}
function adminOpen() { $('#aderr').textContent = ''; $('#adpw').value = ''; $('#adlg').showModal(); setTimeout(() => $('#adpw').focus(), 50); }
$('#adf').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#adpw').value.trim(); if (!pw) return;
  if (!window.EDU_API) { $('#aderr').textContent = '백엔드(Apps Script)가 아직 연결되지 않아 사용할 수 없습니다.'; return; }
  $('#adok').disabled = true; $('#aderr').textContent = '확인 중…';
  try {
    S5.token = pw; await api5('GET', {action:'verify', token:pw});
    S.admin = true; try { sessionStorage.setItem('edu_admin', pw); } catch (_) {}
    $('#adlg').close(); render();
  } catch (err) { S5.token = ''; $('#aderr').textContent = String(err.message || err); }
  $('#adok').disabled = false;
});
$('#adx').addEventListener('click', () => $('#adlg').close());
(() => { try { const pw = sessionStorage.getItem('edu_admin'); if (pw && window.EDU_API) { S5.token = pw; S.admin = true; } } catch (_) {} })();
$('#dx').addEventListener('click', () => $('#dlg').close());
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
// tooltip (hover & tap)
const tip = $('#tip');
document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; } tip.textContent = t.dataset.tip; tip.hidden = false; });
document.addEventListener('pointermove', e => { if (tip.hidden) return; tip.style.left = Math.min(innerWidth - 270, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
document.addEventListener('click', e => { const t = e.target.closest('[data-tip]'); if (t) { tip.textContent = t.dataset.tip; tip.hidden = false; tip.style.left = Math.min(innerWidth - 270, e.clientX + 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; } else tip.hidden = true; });

$('#refresh').addEventListener('click', async e => {
  const b = e.currentTarget; b.classList.add('spin'); b.disabled = true;
  if (window.EDU_API) { await loadRemote(); render(); }
  else { try { await fetch('data.js?t=' + Date.now(), {cache:'reload'}); } catch (_) {} location.reload(); return; }
  b.classList.remove('spin'); b.disabled = false;
});
function stamp() { $('#asof').textContent = (D.checks && D.checks.s1max > D.asof) ? D.checks.s1max : D.asof; $('#upd').textContent = D.built || D.updated; }
async function loadRemote() {
  const api = window.EDU_API; if (!api) return false;
  try {
    const r = await fetch(api + (api.includes('?') ? '&' : '?') + 'action=data&t=' + Date.now(), {cache:'no-store'});
    const j = await r.json();
    if (j && j.sessions) { prep(j); stamp(); return true; }
  } catch (_) {}
  return false;
}
stamp();
if (innerWidth <= 820) document.querySelector('.fcard').removeAttribute('open');
const h = location.hash.slice(1); if (PAGES[h]) S.page = h;
render();
loadRemote().then(ok => { if (ok) render(); });
